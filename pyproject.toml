[project]
name = "course-kit"
version = "0.1.0"
description = "Shared setup, company data and small helpers for the AI Agents course notebooks."
requires-python = ">=3.10"
dependencies = ["openai"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["course_kit"]
